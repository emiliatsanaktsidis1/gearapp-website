  <title>GEAR – Legal</title>
  <style>
    :root {
      --bg:#0b0f14;
      --card:#0f1620;
      --text:#e8eef6;
      --muted:#a9b4c2;
      --link:#00bcd4;
      --border:rgba(255,255,255,0.08);
    }
    body {
      margin:0; padding:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 28px 18px 60px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; }
    h1 { margin: 0 0 6px; font-size: 32px; letter-spacing: -0.02em; }
    h2 { margin-top: 26px; font-size: 22px; }
    h3 { margin-top: 18px; font-size: 18px; }
    p, li { color: var(--text); }
    .muted { color: var(--muted); }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    ul { padding-left: 22px; }
    ol { padding-left: 22px; }
    hr { border:0; border-top:1px solid var(--border); margin: 18px 0; }
    .pill { display:inline-block; padding: 2px 10px; border:1px solid var(--border); border-radius: 999px; color: var(--muted); font-size: 12px; }
    .toc a { display:block; padding: 6px 0; }
    .note { background: rgba(0,188,212,0.10); border: 1px solid rgba(0,188,212,0.25); padding: 12px 14px; border-radius: 12px; }
    code { background: rgba(255,255,255,0.06); padding: 0 6px; border-radius: 6px; }
  </style>
